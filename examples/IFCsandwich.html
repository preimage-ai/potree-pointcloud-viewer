<head>

	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="../../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../../libs/jquery-ui/jquery-ui.min.css">

<body>
	<script src="../../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../../libs/spectrum/spectrum.js"></script>
	<script src="../../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../../libs/other/BinaryHeap.js"></script>
	<script src="../../libs/tween/tween.min.js"></script>
	<script src="../../libs/d3/d3.js"></script>
	<script src="../../libs/proj4/proj4.js"></script>
	<script src="../../libs/openlayers3/ol.js"></script>
	<script src="../../libs/i18next/i18next.js"></script>
	<script src="../../libs/jstree/jstree.js"></script>
	<script src="../../build/potree/potree.js"></script>
	<script src="../../libs/plasio/js/laslaz.js"></script>
	
	
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../../build/potree/resources/images/background.jpg');"> </div>
        <div id="potree_sidebar_container"></div>
	</div>
	
	<script type="module">

	import * as THREE from "../libs/three.js/build/three.module.js";
	import { IFCLoader } from "../libs/three.js/extra/IFCLoader.js";
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		const ifc = new Potree.IFC(viewer);
		console.log(ifc);
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(2_000_000);
		viewer.loadSettingsFromURL();
		viewer.setDescription(`Mobile LIDAR with 360 degree image overlays. 
		Click on a sphere to enter 360 view. Click "unfocus" to leave 360 view. <br>
		Point cloud courtesy of <a href="http://www.helimap.com/">Helimap System SA</a>. Images were downsized for this online demo; Original size is 8000x400.`);
		viewer.loadGUI(() => {
            viewer.setLanguage('en');
            // $("#menu_appearance").next().show();
            // viewer.toggleMap();
            viewer.toggleSidebar();
        });

		// keep your 360 data in example folder by potree name
		const url = 'sanskar/metadata.json';
        const hierarchyUrl = 'sanskar/hierarchy.bin';
        const octreeUrl = 'sanskar/octree.bin';
        const otherPath = {
            octree: octreeUrl,
            hierarchy: hierarchyUrl,
        };
		// Load and add point cloud to scene
		const matrix = [
                [2, 0, 0, 0],
                [0, 2, 0, 0],
                [0, 0, 2, 0],
                [0, 0, 0, 1]
              ];
		Potree.loadPointCloud(url, otherPath, matrix, "ptcld", e => {
			let scene = viewer.scene;
			let pointcloud = e.pointcloud;
			console.log("scene", pointcloud);

						// const mat = new THREE.Matrix4();
						// mat.set(
						// 	matrix[0][0], matrix[0][1], matrix[0][2], matrix[0][3],
						// 	matrix[1][0], matrix[1][1], matrix[1][2], matrix[1][3],
						// 	matrix[2][0], matrix[2][1], matrix[2][2], matrix[2][3],
						// 	matrix[3][0], matrix[3][1], matrix[3][2], matrix[3][3]
						// );
						// pointcloud.applyMatrix4(mat);
						// pointcloud.updateMatrixWorld( true );
						console.log("pointcloud split", pointcloud);
			let material = pointcloud.material;
			material.size = 0.5;
			material.minSize = 2.0;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.SQUARE;
			material.activeAttributeName = "rgba";
			
			scene.addPointCloud(pointcloud);
			viewer.fitToScreen();
			
		});
		// const ifcLoader = new IFCLoader();
		// ifcLoader.ifcManager.setWasmPath('../libs/three.js/extra/ifc/');
		// ifcLoader.load('../pointclouds/Project1.ifc', function (model) {
		// 	model.mesh.rotateX(Math.PI * 0.5);
		// 	model.scale.multiplyScalar(0.3048);
		// 	console.log(scene);
		// 	scene.add(model.mesh);
			
		// });

		ifc.load('sanskar/information.ifc', viewer.scene, "ifc", true, matrix)
												.then(mesh => {
													console.log("loaded mesh", mesh);
												});
		
	</script>
	
  </body>
</html>
